services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tython
      POSTGRES_PASSWORD: tython_local
      POSTGRES_DB: tython
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tython -d tython"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
