name: tython-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/aymane-elb/tython}-backend:${IMAGE_TAG:?IMAGE_TAG requis}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER requis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB requis}
    networks: [web, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    init: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/aymane-elb/tython}-frontend:${IMAGE_TAG:?IMAGE_TAG requis}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

networks:
  web:
  database:
    internal: true

volumes:
  postgres_data:
